<body class="bg-paper font-sans text-ink antialiased">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs></defs></svg>
<header class="border-b border-line bg-white"><div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6"><p class="font-serif text-lg font-extrabold uppercase tracking-[0.2em]">Horizonte · Admin</p><a href="/" class="text-sm font-semibold underline underline-offset-2">Ver la tienda</a></div></header>
<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
<form id="login" class="mx-auto max-w-sm rounded-2xl border border-line bg-white p-6">
<h1 class="font-serif text-2xl font-extrabold">Acceso</h1>
<p class="mt-1 text-sm text-mute">Introduce la contraseña de administración (el secreto <code>ADMIN_TOKEN</code> de tu Worker).</p>
<label for="tok" class="mt-4 block text-sm font-bold">Contraseña</label>
<input id="tok" type="password" autocomplete="current-password" class="mt-1 w-full rounded-xl border border-line p-3 text-base focus:border-clay focus:outline-none focus:ring-2 focus:ring-clay/30">
<p id="login-err" class="mt-2 hidden text-sm font-semibold text-red-700" role="alert"></p>
<button class="mt-4 inline-flex min-h-[48px] w-full items-center justify-center rounded-full bg-ink px-6 font-bold text-white hover:bg-clay">Entrar</button>
</form>
<div id="panel" class="hidden space-y-10">
<section aria-label="Resumen"><div class="grid gap-4 sm:grid-cols-3">
<div class="rounded-2xl border border-line bg-white p-5"><p class="text-xs font-bold uppercase tracking-wide text-mute">Pedidos pagados</p><p id="st-n" class="mt-1 text-3xl font-extrabold">0</p></div>
<div class="rounded-2xl border border-line bg-white p-5"><p class="text-xs font-bold uppercase tracking-wide text-mute">Ingresos (prueba)</p><p id="st-eur" class="mt-1 text-3xl font-extrabold">0 €</p></div>
<div class="rounded-2xl border border-line bg-white p-5"><p class="text-xs font-bold uppercase tracking-wide text-mute">Unidades en stock</p><p id="st-stock" class="mt-1 text-3xl font-extrabold">0</p></div></div></section>
<section aria-label="Pedidos"><h2 class="font-serif text-2xl font-extrabold">Últimos pedidos</h2><div id="orders" class="mt-4 overflow-x-auto rounded-2xl border border-line bg-white"></div></section>
<section aria-label="Inventario"><div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between"><h2 class="font-serif text-2xl font-extrabold">Inventario</h2>
<div><label for="filtro" class="sr-only">Buscar producto</label><input id="filtro" type="search" placeholder="Buscar producto o talla…" class="min-h-[44px] w-full rounded-full border border-line bg-white px-4 text-sm focus:border-clay focus:outline-none focus:ring-2 focus:ring-clay/30 sm:w-72"></div></div>
<div class="mt-4 overflow-x-auto rounded-2xl border border-line bg-white"><table class="w-full text-left text-sm"><caption class="sr-only">Stock por producto, color y talla</caption><thead class="bg-sand text-xs uppercase tracking-wide text-mute"><tr><th class="px-4 py-3">Producto</th><th class="px-4 py-3">Color</th><th class="px-4 py-3">Talla</th><th class="px-4 py-3">Stock</th><th class="px-4 py-3"></th></tr></thead><tbody id="stock"></tbody></table></div></section>
</div>
</main>
<script>
(function () {
"use strict";
var $ = function (id) { return document.getElementById(id); };
var eur = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
var token = sessionStorage.getItem("hz_admin") || "", data = null;
var ESTADOS = { paid: ["Pagado", "bg-emerald-100 text-emerald-800"], pending: ["Pendiente", "bg-amber-100 text-amber-800"], expired: ["Caducado", "bg-stone-200 text-stone-700"], cancelled: ["Cancelado", "bg-stone-200 text-stone-700"], failed: ["Fallido", "bg-red-100 text-red-800"] };
function api(path, opts) { opts = opts || {}; opts.headers = Object.assign({ Authorization: "Bearer " + token, "Content-Type": "application/json" }, opts.headers || {}); return fetch(path, opts).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); }); }
function load() {
return api("/api/admin/summary").then(function (r) {
if (!r.ok) { sessionStorage.removeItem("hz_admin"); $("panel").classList.add("hidden"); $("login").classList.remove("hidden"); if (token) { $("login-err").textContent = "Contraseña incorrecta o sin configurar."; $("login-err").classList.remove("hidden"); } return; }
data = r.d; $("login").classList.add("hidden"); $("panel").classList.remove("hidden"); render();
});
}
function render() {
$("st-n").textContent = data.stats.paid_orders; $("st-eur").textContent = eur.format(data.stats.paid_cents / 100);
$("st-stock").textContent = data.variants.reduce(function (a, v) { return a + v.stock; }, 0);
$("orders").innerHTML = data.orders.length ? '<table class="w-full text-left text-sm"><thead class="bg-sand text-xs uppercase tracking-wide text-mute"><tr><th class="px-4 py-3">Nº</th><th class="px-4 py-3">Estado</th><th class="px-4 py-3">Cliente</th><th class="px-4 py-3">Artículos</th><th class="px-4 py-3 text-right">Total</th></tr></thead><tbody>' +
data.orders.map(function (o) { var e = ESTADOS[o.status] || [o.status, "bg-stone-200"]; return '<tr class="border-t border-line align-top"><td class="px-4 py-3 font-bold">#' + o.id + '</td><td class="px-4 py-3"><span class="rounded-full px-2.5 py-1 text-xs font-bold ' + e[1] + '">' + e[0] + '</span></td><td class="px-4 py-3">' + esc(o.name || "—") + '<br><span class="text-xs text-mute">' + esc(o.email || "") + '</span></td><td class="px-4 py-3">' + o.items.map(function (i) { return esc(i.qty + " × " + i.name); }).join("<br>") + '</td><td class="px-4 py-3 text-right font-bold">' + eur.format(o.total_cents / 100) + "</td></tr>"; }).join("") + "</tbody></table>" : '<p class="p-6 text-sm text-mute">Todavía no hay pedidos. Haz una compra de prueba en la tienda.</p>';
var f = $("filtro").value.trim().toLowerCase();
$("stock").innerHTML = data.variants.filter(function (v) { return !f || (v.product + " " + v.color_name + " " + v.size).toLowerCase().indexOf(f) >= 0; }).map(function (v) {
return '<tr class="border-t border-line"><td class="px-4 py-2 font-semibold">' + esc(v.product) + '</td><td class="px-4 py-2">' + esc(v.color_name) + '</td><td class="px-4 py-2">' + esc(v.size) + '</td><td class="px-4 py-2"><label class="sr-only" for="s' + v.id + '">Stock</label><input id="s' + v.id + '" type="number" min="0" max="10000" value="' + v.stock + '" class="w-24 rounded-lg border border-line p-2 ' + (v.stock === 0 ? "bg-red-50" : "") + '"></td><td class="px-4 py-2"><button type="button" data-save="' + v.id + '" class="min-h-[40px] rounded-full bg-ink px-4 text-xs font-bold text-white hover:bg-clay">Guardar</button> <span id="m' + v.id + '" class="ml-1 text-xs font-bold text-emerald-700"></span></td></tr>';
}).join("");
}
$("login").addEventListener("submit", function (e) { e.preventDefault(); token = $("tok").value; sessionStorage.setItem("hz_admin", token); $("login-err").classList.add("hidden"); load(); });
$("filtro").addEventListener("input", function () { if (data) { render(); } });
$("stock").addEventListener("click", function (e) {
var b = e.target.closest("[data-save]"); if (!b) { return; }
var id = +b.dataset.save, val = parseInt($("s" + id).value, 10);
api("/api/admin/stock", { method: "POST", body: JSON.stringify({ variantId: id, stock: val }) }).then(function (r) {
var m = $("m" + id); m.textContent = r.ok ? "Guardado" : "Error"; m.className = "ml-1 text-xs font-bold " + (r.ok ? "text-emerald-700" : "text-red-700");
if (r.ok) { data.variants.forEach(function (v) { if (v.id === id) { v.stock = val; } }); $("st-stock").textContent = data.variants.reduce(function (a, v) { return a + v.stock; }, 0); }
setTimeout(function () { m.textContent = ""; }, 2000);
});
});
if (token) { load(); }
})();
</script>
</body>
</html>
