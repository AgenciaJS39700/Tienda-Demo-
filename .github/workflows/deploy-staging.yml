# Despliegue manual del entorno de PRUEBAS (no toca la demo ni a ningún cliente).
# Se lanza desde GitHub → Actions → "Deploy staging" → Run workflow.
name: Deploy staging
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy -c wrangler.staging.jsonc
